name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + unit tests
        run: mvn -B -e clean test

      - name: Integration tests (Testcontainers)
        run: mvn -B -e verify
        # Testcontainers needs Docker, available on ubuntu-latest runners.

      - name: Package fat jar
        run: mvn -B -e package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: log-analysis-pipeline
          path: target/log-analysis-pipeline.jar
