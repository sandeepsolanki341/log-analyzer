# Defaults; every key is overridable by the matching ENV var (db.url -> DB_URL).
# Production deployments should set secrets (db.password, es.password, redis.password)
# via environment variables / a secrets manager, NOT this file.

db.url=jdbc:mysql://localhost:3306/logs?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
db.user=root
db.password=
db.pool.size=8
source.zone=UTC

pipeline.name=app-logs
batch.size=5000

es.host=localhost
es.port=9200
es.scheme=http
index.sub.batch.size=500
index.max.bytes=5242880
bulk.max.attempts=4
bulk.base.delay.ms=1000
bulk.max.delay.ms=30000

window.seconds=300
anomaly.spike.multiplier=3.0
anomaly.min.events=50
anomaly.failed.login.threshold=20
anomaly.ema.alpha=0.3

redis.host=localhost
redis.port=6379
redis.key.prefix=pipeline:anomaly:

run.interval.seconds=10
health.port=8080
shutdown.grace.seconds=30
