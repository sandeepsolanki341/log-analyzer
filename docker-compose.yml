# Full local stack: MySQL + Elasticsearch + Kibana + Redis + the pipeline.
#   docker compose up --build
# Then generate some logs into app_logs and watch them appear in Kibana (http://localhost:5601).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: logs
    ports: ["3306:3306"]
    volumes:
      - ./deploy/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/sql/seed-sample.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  template-init:
    image: curlimages/curl:8.8.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./deploy/elasticsearch:/work:ro
    entrypoint: ["sh","-c","curl -sS -X PUT http://elasticsearch:9200/_index_template/app-logs -H 'Content-Type: application/json' --data-binary @/work/index-template.json && echo template-applied"]

  pipeline:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/logs?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DB_USER: root
      DB_PASSWORD: rootpw
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ES_SCHEME: http
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_INTERVAL_SECONDS: "5"
      BATCH_SIZE: "5000"
      WINDOW_SECONDS: "300"
    ports: ["8080:8080"]
